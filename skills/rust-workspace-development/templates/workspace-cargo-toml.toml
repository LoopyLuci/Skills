[workspace]
members = [
    "crates/genetics",
    "crates/protocol",
    "crates/plugin",
    "server",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/loopyluci/cubeworld"

[workspace.dependencies]
cubeworld-genetics = { path = "crates/genetics" }
cubeworld-protocol = { path = "crates/protocol" }
cubeworld-plugin = { path = "crates/plugin" }
